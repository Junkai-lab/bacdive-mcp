[project]
name = "bacdive-mcp"
version = "0.1.0"
description = "Unofficial MCP server for the BacDive prokaryotic strain database"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Junkai-lab" }]
keywords = ["mcp", "bacdive", "microbiology"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27",
    "mcp>=2.3,<3",
]

[project.scripts]
bacdive-mcp = "bacdive_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls BacDive, the BacDive SPARQL endpoint, or the public NCBI taxonomy API",
]
